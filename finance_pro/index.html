<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Finance Manager Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.303.0/dist/umd/lucide.min.js"></script>
<style>
/* ===== Design tokens ===== */
:root, [data-theme="light"]{
  --bg:#f2f4f3; --sidebar:#49111c; --sidebar-hover:#5c1a26; --card:#ffffff;
  --border:#e6e4df; --border-strong:#9c8670;
  --text:#0a0908; --muted:#5e503f; --faint:#7d6a5b;
  --accent:#49111c; --accent-text:#f2f4f3; --accent-soft:#f1e7e9;
  --green:#2f6b4c; --green-soft:#e7efe9;
  --red:#c2382c; --red-soft:#f9e8e5;
  --amber:#96610f; --amber-soft:#f7efe1;
  --shadow:0 1px 2px rgba(10,9,8,.05), 0 8px 24px -12px rgba(10,9,8,.16);
  --grid-line:rgba(10,9,8,.07);
}
[data-theme="dark"]{
  --bg:#0a0908; --sidebar:#49111c; --sidebar-hover:#5c1a26; --card:#151211;
  --border:#2c2624; --border-strong:#8a7663;
  --text:#f2f4f3; --muted:#c3ae99; --faint:#a9927d;
  --accent:#a9927d; --accent-text:#0a0908; --accent-soft:#241d1c;
  --green:#63a886; --green-soft:#14261e;
  --red:#e27066; --red-soft:#2e1815;
  --amber:#d5a04f; --amber-soft:#2a2013;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --grid-line:rgba(242,244,243,.08);
}
[data-theme="contrast"]{
  --bg:#f2f4f3; --sidebar:#49111c; --sidebar-hover:#5c1a26; --card:#ffffff;
  --border:#a9927d; --border-strong:#5e503f;
  --text:#0a0908; --muted:#4a3f33; --faint:#5e503f;
  --accent:#49111c; --accent-text:#f2f4f3; --accent-soft:#ecdee1;
  --green:#1f5540; --green-soft:#dcebe3;
  --red:#a32a20; --red-soft:#f7e3df;
  --amber:#7a4c08; --amber-soft:#f5ead6;
  --shadow:0 2px 0 rgba(10,9,8,.14);
  --grid-line:rgba(10,9,8,.14);
}
*{ -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
}
.tnum{ font-variant-numeric:tabular-nums; }
.text-wrap-pretty{ text-wrap:pretty; }
::selection{ background:var(--accent-soft); color:var(--text); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:3px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background:var(--faint); background-clip:padding-box; border:3px solid transparent; }

/* ===== Components ===== */
.card{ background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }
.card-flat{ background:var(--card); border:1px solid var(--border); border-radius:14px; }
.card-hover{ transition:border-color .18s ease, box-shadow .18s ease; }
@media (hover:hover) and (pointer:fine){
  .card-hover:hover{ border-color:var(--border-strong); box-shadow:var(--shadow); }
}
.eyebrow{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--faint); }
.btn{ display:inline-flex; align-items:center; gap:7px; border-radius:10px; font-weight:600; font-size:13px;
  padding:8px 13px; border:1px solid var(--border); background:var(--card); color:var(--text);
  cursor:pointer; transition:background .15s ease, border-color .15s ease, transform .12s ease, color .15s ease; }
.btn:hover{ background:var(--bg); border-color:var(--border-strong); }
.btn:active{ transform:scale(.975); }
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.btn-primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
.btn-primary:hover{ background:var(--accent); color:var(--accent-text); filter:brightness(1.15); }
.btn-danger{ background:var(--red); color:#fff; border-color:var(--red); }
.btn-danger:hover{ background:var(--red); color:#fff; filter:brightness(1.1); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--bg); border-color:var(--border); }
.btn-sm{ padding:5px 9px; font-size:12px; border-radius:8px; }
.icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px;
  border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer;
  transition:background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease; }
.icon-btn:hover{ background:var(--bg); color:var(--text); border-color:var(--border-strong); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn.sm{ width:28px; height:28px; border-radius:8px; }
.inp, select.inp{ width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:9px 11px; font-size:13.5px; color:var(--text); font-family:inherit;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease; }
.inp::placeholder{ color:var(--faint); }
.inp:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--card); }
select.inp{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px; }
label.fld{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:5px; letter-spacing:.02em; }
.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;
  background:var(--bg); border:1px solid var(--border); color:var(--muted); }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:7px; font-size:11px; font-weight:700; letter-spacing:.01em; }
.badge-green{ background:var(--green-soft); color:var(--green); }
.badge-red{ background:var(--red-soft); color:var(--red); }
.badge-amber{ background:var(--amber-soft); color:var(--amber); }
.badge-neutral{ background:var(--accent-soft); color:var(--text); }
.dot{ width:8px; height:8px; border-radius:99px; flex:none; }
.progress{ height:7px; background:var(--bg); border:1px solid var(--border); border-radius:99px; overflow:hidden; }
.progress > span{ display:block; height:100%; border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1); }
.hairline{ border-color:var(--border); }
.stat-value{ font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.15; }
.kpi{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 14px;
  transition:border-color .18s ease, box-shadow .18s ease; position:relative; overflow:hidden; }
@media (hover:hover) and (pointer:fine){
  .kpi:hover{ border-color:var(--border-strong); box-shadow:var(--shadow); }
}
/* Section heads: small caps title anchored on a hairline rule (broadsheet voice) */
.section-head{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.section-title{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text); white-space:nowrap; }
.section-rule{ flex:1; min-width:24px; height:1px; background:var(--border); }
.section-meta{ display:inline-flex; align-items:center; gap:8px; flex:none; }

/* ===== Broadsheet (dashboard) ===== */
.display{ font-family:'Fraunces',Georgia,'Times New Roman',serif; font-optical-sizing:auto;
  font-variant-numeric:tabular-nums; }
.dateline{ font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; }

.masthead{ background:var(--sidebar); color:#e9e2dc; padding:clamp(20px,3vw,34px) clamp(18px,3vw,36px) clamp(24px,3.4vw,38px); }
.mast-dateline{ color:#a9927d; }
.masthead .btn-primary{ background:#f2f4f3; color:#0a0908; border-color:#f2f4f3; }
.masthead .btn-primary:hover{ background:#f2f4f3; color:#0a0908; filter:brightness(.94); }
.masthead .btn:focus-visible{ outline:2px solid #a9927d; outline-offset:2px; }
.mast-grid{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:22px 48px; margin-top:16px; }
.mast-title{ font-size:clamp(26px,2.6vw,34px); font-weight:600; color:#f2f4f3; line-height:1;
  letter-spacing:-.01em; margin:0 0 20px; }
.mast-hero-label{ color:#a9927d; margin-bottom:8px; }
.mast-hero{ font-size:clamp(46px,6.2vw,84px); font-weight:600; line-height:.98; letter-spacing:-.015em; color:#f2f4f3; }
.mast-hero .cents{ font-size:.44em; letter-spacing:0; color:#d8c6b1; }
.mast-mini{ display:flex; flex-direction:column; gap:7px; min-width:min(320px,100%); padding-bottom:4px; }
.mast-mini .mrow{ display:flex; align-items:baseline; gap:8px; }
.mast-mini .mk{ font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:#a9927d; white-space:nowrap; }
.mast-mini .mlead{ flex:1; min-width:20px; border-bottom:1px dotted rgba(242,244,243,.35); transform:translateY(-3px); }
.mast-mini .mv{ font-size:13.5px; font-weight:600; color:#f2f4f3; white-space:nowrap; }

.hero-stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-bottom:1px solid var(--border); }
.hero-stats > .hstat{ padding:20px 24px 22px; border-left:1px solid var(--border); min-width:0; }
.hero-stats > .hstat:first-child{ border-left:none; padding-left:0; }
.hero-value{ font-size:clamp(25px,2.3vw,31px); font-weight:600; letter-spacing:-.01em; line-height:1.12; margin-top:9px; }
.stat-sub{ font-size:11.5px; color:var(--muted); margin-top:6px; }
@media (max-width:767px){
  .hero-stats{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .hero-stats > .hstat:nth-child(odd){ border-left:none; padding-left:0; }
  .hero-stats > .hstat:nth-child(even){ padding-right:0; }
}

.att-row{ display:flex; align-items:flex-start; gap:13px; padding:13px 8px; margin:0 -8px;
  border-bottom:1px solid var(--border); cursor:pointer; transition:background .12s ease; }
.att-row:hover{ background:var(--card); }
.att-row:last-child{ border-bottom:none; }
.att-num{ font-size:15px; font-weight:600; width:24px; flex:none; line-height:1.35; }

.ledger{ display:grid; grid-template-columns:1fr; column-gap:56px; }
@media (min-width:640px){ .ledger{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.led-row{ padding:11px 0; border-bottom:1px solid var(--border); }
.led-main{ display:flex; align-items:baseline; gap:8px; }
.led-label{ font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.led-lead{ flex:1; min-width:18px; border-bottom:1px dotted var(--border-strong); transform:translateY(-4px); }
.led-value{ font-size:14.5px; font-weight:700; white-space:nowrap; }
.led-sub{ font-size:11.5px; color:var(--muted); margin-top:3px; }

.lt-table{ border-top:1px solid var(--text); }
.lt-row{ display:grid; grid-template-columns:minmax(140px,1.1fr) minmax(120px,2fr) minmax(150px,auto) 54px;
  align-items:center; gap:18px; padding:11px 0; border-bottom:1px solid var(--border); }
.lt-name{ display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; min-width:0; }
.lt-name span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lt-bar{ height:7px; }
.lt-amt{ font-size:12.5px; text-align:right; white-space:nowrap; }
.lt-pct{ font-size:13px; font-weight:700; text-align:right; }
@media (max-width:639px){
  .lt-row{ grid-template-columns:1fr auto auto; gap:8px 14px; }
  .lt-bar{ grid-column:1 / -1; grid-row:2; }
  .lt-amt{ grid-column:1 / -1; grid-row:3; text-align:left; font-size:11.5px; }
}

/* ===== Tables ===== */
.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px; }
.tbl thead th{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--faint);
  text-align:left; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:2; white-space:nowrap; }
.tbl tbody td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.tbl tbody tr{ transition:background .12s ease; }
.tbl tbody tr:hover{ background:var(--bg); }
.tbl tbody tr:last-child td{ border-bottom:none; }
.tbl .sortable{ cursor:pointer; user-select:none; }
.tbl .sortable:hover{ color:var(--text); }

/* ===== Sidebar ===== */
#sidebar{ width:264px; flex:none; background:var(--sidebar); color:#e9e2dc; display:flex; flex-direction:column;
  transition:width .22s cubic-bezier(.22,1,.36,1), transform .25s cubic-bezier(.22,1,.36,1); z-index:40; }
#sidebar.collapsed{ width:76px; }
#sidebar .nav-label{ transition:opacity .16s ease, width .22s ease; overflow:hidden; white-space:nowrap; }
#sidebar.collapsed .nav-label{ opacity:0; width:0; pointer-events:none; }
#sidebar.collapsed .nav-group-title, #sidebar.collapsed .brand-sub, #sidebar.collapsed .nav-badge{ display:none; }
#sidebar.collapsed .navlink{ justify-content:center; padding-left:0; padding-right:0; }
.navlink{ position:relative; display:flex; align-items:center; gap:11px; padding:8px 11px; border-radius:10px;
  color:#e9e2dc; font-size:13.5px; font-weight:500; cursor:pointer; transition:background .14s ease, color .14s ease; }
.navlink:hover{ background:var(--sidebar-hover); color:#f2f4f3; }
.navlink.active{ background:var(--sidebar-hover); color:#fff; font-weight:600; }
.navlink.active::before{ content:""; position:absolute; left:-13px; top:50%; transform:translateY(-50%);
  width:3.5px; height:20px; border-radius:0 4px 4px 0; background:#a9927d; }
.nav-badge{ margin-left:auto; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:99px;
  background:rgba(255,255,255,.09); color:#f2f4f3; }
.nav-badge.alert{ background:var(--red); color:#fff; }
.nav-group-title{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
  color:#a9927d; padding:0 11px; margin:16px 0 6px; }

/* ===== Topbar ===== */
#topbar{ background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); }
.search-wrap{ position:relative; }
.search-pop{ position:absolute; top:calc(100% + 8px); left:0; width:min(460px,86vw); max-height:380px; overflow:auto;
  background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); z-index:60; padding:6px; }
.drop{ background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
.drop-item{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px; cursor:pointer; font-size:13.5px;
  transition:background .12s ease; }
.drop-item:hover{ background:var(--bg); }
.month-nav{ display:flex; align-items:center; gap:4px; }
.month-label{ min-width:132px; text-align:center; font-weight:700; font-size:13.5px; letter-spacing:-.01em; }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:99px; font-size:12.5px;
  font-weight:600; background:var(--card); border:1px solid var(--border); white-space:nowrap; }
.pill b{ font-weight:700; }

/* ===== View / layout ===== */
#view{ animation:viewIn .28s cubic-bezier(.22,1,.36,1); }
@keyframes viewIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }
@keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.985);} to{ opacity:1; transform:none; } }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes toastIn{ from{ opacity:0; transform:translateX(24px);} to{ opacity:1; transform:none; } }
.pop{ animation:popIn .22s cubic-bezier(.22,1,.36,1); }

/* ===== Modal ===== */
#modal-root{ position:fixed; inset:0; z-index:90; display:none; }
#modal-root.open{ display:block; }
.modal-overlay{ position:absolute; inset:0; background:rgba(10,9,8,.5); backdrop-filter:blur(3px); animation:fadeIn .18s ease; }
.modal-panel{ position:relative; margin:5vh auto; width:min(680px,94vw); max-height:88vh; overflow:auto;
  background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:0 30px 70px -30px rgba(10,9,8,.55);
  animation:popIn .22s cubic-bezier(.22,1,.36,1); }
.modal-panel.narrow{ width:min(460px,94vw); }
.tab-btn{ padding:7px 13px; font-size:13px; font-weight:600; border-radius:9px; color:var(--muted); cursor:pointer;
  border:1px solid transparent; transition:all .14s ease; }
.tab-btn:hover{ background:var(--bg); color:var(--text); }
.tab-btn.active{ background:var(--accent); color:var(--accent-text); }

/* ===== Calendar ===== */
.cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--border); border-left:1px solid var(--border); }
.cal-cell{ min-height:104px; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  padding:7px; background:var(--card); cursor:pointer; transition:background .13s ease; position:relative; overflow:hidden; }
.cal-cell:hover{ background:var(--bg); }
.cal-cell.muted{ opacity:.45; }
.cal-cell.today{ box-shadow:inset 0 0 0 2px var(--accent); }
.cal-dow{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--faint);
  padding:9px 8px; background:var(--bg); border-right:1px solid var(--border); border-bottom:1px solid var(--border); text-align:center; }
.cal-daynum{ font-size:12.5px; font-weight:700; color:var(--muted); width:22px; height:22px; display:flex; align-items:center;
  justify-content:center; border-radius:99px; margin-bottom:4px; }
.cal-cell.today .cal-daynum{ background:var(--accent); color:var(--accent-text); }
.cal-ev{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2.5px 6px;
  border-radius:6px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ===== Toast ===== */
#toast-root{ position:fixed; right:20px; bottom:20px; z-index:120; display:flex; flex-direction:column; gap:9px; align-items:flex-end; }
.toast{ display:flex; align-items:center; gap:10px; padding:11px 15px; border-radius:12px; font-size:13.5px; font-weight:600;
  background:var(--accent); color:var(--accent-text); box-shadow:0 14px 34px -14px rgba(10,9,8,.6);
  animation:toastIn .26s cubic-bezier(.22,1,.36,1); max-width:min(420px,90vw); }
.toast.err{ background:var(--red); color:#fff; }
.toast.ok{ background:var(--green); color:#fff; }

/* ===== Misc ===== */
.progress-row:hover .progress{ transform:scaleY(1.35); }
.progress{ transition:transform .18s ease; transform-origin:center; }
.dropzone{ border:2px dashed var(--border-strong); border-radius:16px; transition:border-color .18s ease, background .18s ease; }
.dropzone.hot{ border-color:var(--accent); background:var(--accent-soft); }
.list-row{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--border);
  border-radius:12px; background:var(--card); transition:border-color .14s ease, background .14s ease; }
.list-row:hover{ border-color:var(--border-strong); }
.muted{ color:var(--muted); } .faint{ color:var(--faint); }
.avatar-ic{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; font-size:13px; font-weight:700; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
@media (max-width:1023px){
  #sidebar{ position:fixed; left:0; top:0; bottom:0; transform:translateX(-102%); width:264px !important; }
  #sidebar.mobile-open{ transform:translateX(0); box-shadow:0 0 60px rgba(0,0,0,.4); }
  #sidebar .nav-label{ opacity:1 !important; width:auto !important; }
  #sidebar .nav-group-title, #sidebar .brand-sub, #sidebar .nav-badge{ display:block !important; }
  #sidebar .nav-badge{ display:inline-flex !important; }
}
#sidebar-backdrop{ position:fixed; inset:0; background:rgba(10,9,8,.5); z-index:39; display:none; }
#sidebar-backdrop.show{ display:block; animation:fadeIn .18s ease; }
</style>
</head>
<body>
<div id="app" class="flex h-screen overflow-hidden">
  <aside id="sidebar" aria-label="Primary navigation"></aside>
  <div id="sidebar-backdrop"></div>
  <div class="flex-1 flex flex-col min-w-0">
    <header id="topbar"></header>
    <div id="storage-banner" role="alert" class="hidden"></div>
    <main id="view" class="flex-1 overflow-y-auto"></main>
  </div>
</div>

/* ---------- Utils ---------- */

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const todayISO = () => iso(new Date());
const dim = (y, m) => new Date(y, m+1, 0).getDate();
const clampDay = (y, m, day) => Math.min(day, dim(y, m));
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth()+n, 1);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const startOfWeek = d => addDays(d, -((d.getDay()+6) % 7));

function money(n, opts={}){
  const s = DB.data.settings;
  const v = Math.abs(Number(n)||0);
  const neg = (Number(n)||0) < 0;
  let str;
  if (s.currency === 'CUSTOM'){
    str = (s.customSymbol || '$') + v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  } else {
    try { str = new Intl.NumberFormat('en-US',{style:'currency', currency:s.currency, maximumFractionDigits:2}).format(v); }
    catch(e){ str = '$' + v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
  }
  if (opts.signed) return (neg ? '−' : '+') + str;
  return (neg ? '−' : '') + str;
}
// Compact money for chart axes / donut centres: "$1.5M", "$12.35k", "$950".
// The old regexes never matched what money() actually emits: "(\d)\.\d\d"
// collapsed 1.5M to "$1M", and "\.0$" never matched "$10.00" → "$10.00k".
const dropCents = s => s.replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
const moneyShort = n => {

/* ---------- Balance reconciliation ---------- */
// Signed net movement of one account from a transaction list.
function netMovementsFor(txns, accountId){
  return txns.reduce((s, t) => {
    if (t.type === 'transfer'){
      if (t.accountId === accountId) s -= t.amount;
      if (t.toAccountId === accountId) s += t.amount;
      return s;
    }
    if (t.accountId !== accountId) return s;
    return s + (t.type === 'income' ? t.amount : -t.amount);
  }, 0);
}
// Single place where account balances are (re)derived from opening balance + ledger.
function syncBalances(d){
  d = d || DB.data;
  if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.transactions)) return;
  d.accounts.forEach(a => {
    if (!Number.isFinite(a.openingBalance)) a.openingBalance = Number(a.balance) || 0;
    a.balance = Math.round((a.openingBalance + netMovementsFor(d.transactions, a.id)) * 100) / 100;
  });
}

/* ---------- Persistent state ---------- */
const STORAGE_KEY = 'PFM_PRO_DATA_v1';

/* ---------- Storage health (Part C) -------------------------------
   Persistence honesty: localStorage can be blocked (private windows), full
   (quota) or read-only. When that happens the app keeps working in memory,
   but nothing survives a reload — so we say so *persistently* instead of
   dropping a toast that disappears. Two independent probes:
     read  — getItem round-trip works
     write — setItem does not throw
   `ok` is only true when both pass; the reason string is kept for display.
------------------------------------------------------------------- */
const storageReason = e => {
  const n = (e && e.name) || 'Error';
  const m = (e && e.message) || '';
  return n + (m ? ': ' + m : '');
};
const StorageWarn = {
  readOk: true, writeOk: true, reason: '',
  get ok(){ return this.readOk && this.writeOk; },
  set(kind, ok, reason){
    const prevOk = this.ok, prevReason = this.reason;
    if (kind === 'read') this.readOk = !!ok; else this.writeOk = !!ok;
    if (this.ok) this.reason = '';
    else if (!ok) this.reason = reason || prevReason || 'localStorage is unavailable';
    const changed = prevOk !== this.ok || prevReason !== this.reason;
    if (!changed) return;
    renderStorageWarning();
    toast(this.ok ? 'Storage is working again — saving normally'
                  : 'Storage unavailable — changes will not survive a reload',
          this.ok ? 'ok' : 'err');
  }
};
// Probe a real write + read round-trip through a scratch key.
function probeStorage(){
  let store = null;
  try { store = window.localStorage; } catch(e){ return {read:false, write:false, reason:'localStorage is blocked (' + storageReason(e) + ')'}; }
  if (!store) return {read:false, write:false, reason:'localStorage is not available in this browser'};
  const k = 'PFM_PRO_PROBE';
  let write = true, read = true, reason = '';
  try { store.setItem(k, '1'); } catch(e){ write = false; reason = storageReason(e); }
  if (write){
    try { if (store.getItem(k) !== '1'){ read = false; reason = reason || 'reads returned nothing back'; } }
    catch(e){ read = false; reason = reason || storageReason(e); }
  }
  try { store.removeItem(k); } catch(e){}
  return {read, write, reason};
}
function refreshStorageHealth(){
  const p = probeStorage();
  StorageWarn.set('write', p.write, p.reason);
  StorageWarn.set('read', p.read, p.reason);
}
// Persistent banner + topbar chip. Non-blocking: it never prevents use of the app.
function renderStorageWarning(){
  const banner = $('#storage-banner');
  if (banner){
    const ok = StorageWarn.ok;
    banner.classList.toggle('hidden', ok);
    if (ok) banner.innerHTML = '';
    else {
      banner.innerHTML = `
        <div class="px-4 sm:px-6 py-2.5 flex flex-wrap items-center gap-2.5 text-[12.5px] leading-snug"
             style="background:var(--red-soft);border-bottom:1px solid var(--red)">
          <span class="shrink-0" style="color:var(--red)">${ic('alert-triangle','w-4 h-4')}</span>
          <span class="flex-1 min-w-[240px] text-wrap-pretty">
            <b>Not saving to this browser.</b> ${esc(StorageWarn.reason)} — edits are held in memory only and will be
            lost on reload. Export a JSON backup to keep them.
          </span>
          <span class="flex gap-2 shrink-0">
            <button class="btn btn-sm" data-action="export-json">${ic('download','w-3.5 h-3.5')}Export backup</button>
            <button class="btn btn-sm" data-action="storage-retry">${ic('refresh-cw','w-3.5 h-3.5')}Retry</button>
          </span>
        </div>`;
      icons(banner);
    }
  }
  if (typeof DB !== 'undefined' && DB.data) renderTopbar();
}

const DB = {
  data: null,
  load(){
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); StorageWarn.set('read', true); }
    catch(e){ StorageWarn.set('read', false, storageReason(e)); }
    if (raw){
      try {
        const parsed = JSON.parse(raw);
        if (this.validate(parsed)){ this.data = this.normalize(parsed); syncBalances(this.data); this.save(); return; }
        toast('Saved data is missing required sections — reloading sample data', 'err');
      } catch(e){
        toast('Saved data was unreadable (' + storageReason(e) + ') — reloading sample data', 'err');
      }
    }
    this.data = this.seed();
    syncBalances(this.data);
    this.save();
  },
  seed(){ const d = seedData(); this.data = d; syncBalances(d); return d; },
  save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); StorageWarn.set('write', true); }
    catch(e){ StorageWarn.set('write', false, storageReason(e)); }
  },
  validate(d){
    if (!d || typeof d !== 'object') return false;
    const ok = ['settings','accounts','categories','transactions','bills','subscriptions'];
    return ok.every(k => Object.prototype.hasOwnProperty.call(d, k));
  },
  normalize(d){
    const s = d.settings || {};
    const txns = d.transactions || [];
    const accounts = (d.accounts || []).map(a => {
      // Legacy data has no openingBalance: back it out of the stored balance
      // so existing figures are preserved while future edits reconcile.
      if (!Number.isFinite(a.openingBalance)){
        a = Object.assign({}, a, {
          openingBalance: Math.round(((Number(a.balance) || 0) - netMovementsFor(txns, a.id)) * 100) / 100
        });
      }
      return a;
    });
    const bills = (d.bills || []).map(b => Object.assign({}, b, {paidPeriods: normalizePaidPeriods(b.paidPeriods)}));
    return {
      version: 1,
      settings: Object.assign({currency:'USD', customSymbol:'$', budgetStartDay:1, theme:'light', tags:[]}, s),
      accounts,
      categories: d.categories || [],
      transactions: txns,
      bills,
      subscriptions: d.subscriptions || [],

      tasks: d.tasks || []
    };
  },
  // withDemo=false → start empty (settings + empty collections, no sample rows)
  // withDemo=true  → reload the deterministic sample portfolio
  reset(withDemo=false){
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    this.data = withDemo ? seedData() : this.normalize({});
    syncBalances(this.data);
    this.save();
  }
};

/* ---------- Lookups ---------- */
const cat = id => DB.data.categories.find(c => c.id === id);

/* ---------- Period helpers (budget cycle aware) ----------
   CURSOR RULE (Part C) — one clock per number, never two:
   1. Every period metric reads an explicit cursor; one function must not mix
      "the selected period" with "right now".
   2. View-bound surfaces (KPIs, budgets, charts, calendar, month nav) use UI.month.
   3. Global "now" surfaces (attention bell, Today, alerts) never read UI.month —
      they derive their cursor from a single `now` via currentPeriodCursor() /
      monthStart(now), so paging through history cannot change a global alert.
   4. Bills are keyed by calendar month (paidPeriods = dayKey of a date) and
      budgets by budget period; when budgetStartDay === 1 both cursors are the
      same date, which is the default configuration.
-------------------------------------------------------------------- */
function periodRange(cursor){
  const sd = clamp(DB.data.settings.budgetStartDay || 1, 1, 31);
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const start = new Date(y, m, clampDay(y, m, sd));
  const end = new Date(y, m+1, clampDay(y, m+1, sd));
  return { start, end, startISO: iso(start), endISO: iso(end) };
}
const inRange = (dateStr, start, end) => dateStr >= iso(start) && dateStr < iso(end);
const periodTx = cursor => {
  const {start, end} = periodRange(cursor);
  return DB.data.transactions.filter(t => inRange(t.date, start, end));
};
function isCurrentPeriod(cursor){
  const {start, end} = periodRange(cursor);
  const now = new Date();
  return now >= start && now < end;
}
// The cursor whose budget period contains `now`. Equal to monthStart(now) when
// budgetStartDay === 1; rolls back one month once today falls before this
// month's cycle start day (start day 15, today the 5th → last month's cursor).
function currentPeriodCursor(now){
  const n = now || new Date();
  const thisMonth = monthStart(n);
  const {start} = periodRange(thisMonth);
  return n < start ? addMonths(thisMonth, -1) : thisMonth;
}
// Whole days elapsed inside `cursor`'s period: 0 before the period starts, the
// full period length once it is over, otherwise calendar days counted from the
// start day (DST-safe via daysBetween — never ms ceilings or clamped clocks).
function daysElapsedInPeriod(cursor = UI.month){
  const now = new Date();
  const {start, end} = periodRange(cursor);
  if (now >= end) return periodDays(cursor);
  if (now < start) return 0;
  return Math.max(1, daysBetween(iso(start), iso(now)) + 1);
}
const periodDays = cursor => {
  const {start, end} = periodRange(cursor);
  return Math.max(1, daysBetween(iso(start), iso(end)));
};
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
// paidPeriods stores canonical month keys (dayKey of any day in the month).
// Migrates legacy keys ('2026-9' from the old seed, which was 0-based) to canonical form.
function normalizePaidPeriods(arr){
  if (!Array.isArray(arr)) return [];
  const out = [];
  arr.forEach(k => {
    const m = /^(\d{4})-(\d{1,2})$/.exec(String(k).trim());
    if (!m) return;
    let month = parseInt(m[2], 10);
    if (m[2].length === 1) month += 1; // legacy seed wrote 0-based month numbers
    if (month >= 1 && month <= 12){
      const key = `${m[1]}-${String(month).padStart(2,'0')}`;
      if (!out.includes(key)) out.push(key);
    }
  });
  return out;
}

/* ---------- Bills / subscriptions ---------- */
function billDueDate(b, cursor){
  const c = cursor || UI.month;
  return new Date(c.getFullYear(), c.getMonth(), clampDay(c.getFullYear(), c.getMonth(), b.dueDay || 1));
}
function billPaid(b, cursor = UI.month){ return (b.paidPeriods || []).includes(dayKey(cursor)); }
function billStatus(b, cursor = UI.month){
  if (billPaid(b, cursor)) return 'paid';
  const due = billDueDate(b, cursor), now = new Date();
  if (due < new Date(now.getFullYear(), now.getMonth(), now.getDate())) return 'overdue';
  const diff = Math.round((due - now) / 86400000);
  if (diff <= 5) return 'due-soon';
  return 'upcoming';
}
function subMonthly(s){
  if (s.cycle === 'annual') return s.amount / 12;
  if (s.cycle === 'weekly') return s.amount * 4.33;
  return s.amount;
}
const activeSubs = () => DB.data.subscriptions.filter(s => s.active);

/* ---------- Metrics (computed getters) ---------- */
function metrics(){
  const cur = UI.month;
  const now = new Date();
  const tx = periodTx(cur);
  const prevTx = periodTx(addMonths(cur, -1));

  const income = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const expense = tx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  const net = income - expense;

  const cats = DB.data.categories;
  const budgetTotal = cats.reduce((s,c) => s + (c.budget || 0), 0);
  const budgetSpent = cats.reduce((s,c) => s + tx.filter(t => t.type === 'expense' && t.categoryId === c.id)
    .reduce((x,t) => x + t.amount, 0), 0);
  const budgetLeft = budgetTotal - budgetSpent;

  const accounts = DB.data.accounts;
  const assets = accounts.filter(a => a.balance > 0).reduce((s,a) => s + a.balance, 0);
  const liabilities = Math.abs(accounts.filter(a => a.balance < 0).reduce((s,a) => s + a.balance, 0));
  const netWorth = assets - liabilities;
  const cashAccounts = accounts.filter(a => a.type === 'checking' || a.type === 'cash').reduce((s,a) => s + a.balance, 0);
  const creditBal = Math.abs(accounts.filter(a => a.type === 'credit').reduce((s,a) => s + a.balance, 0));
  const savingsInv = accounts.filter(a => a.type === 'savings' || a.type === 'investment').reduce((s,a) => s + a.balance, 0);
  const emergency = accounts.filter(a => a.emergency).reduce((s,a) => s + a.balance, 0);

  const subs = activeSubs();
  const subCost = subs.reduce((s,x) => s + subMonthly(x), 0);

  const nowKey = dayKey(now);
  const billsNow = DB.data.bills;
  const unpaidNow = billsNow.filter(b => !(b.paidPeriods||[]).includes(nowKey));
  const overdueBills = unpaidNow.filter(b => {
    const due = new Date(now.getFullYear(), now.getMonth(), clampDay(now.getFullYear(), now.getMonth(), b.dueDay||1));
    return due < new Date(now.getFullYear(), now.getMonth(), now.getDate());
  });
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const upcoming30 = billsNow.filter(b => {
    const due = new Date(now.getFullYear(), now.getMonth(), clampDay(now.getFullYear(), now.getMonth(), b.dueDay||1));
    // Whole days against midnight, not against the current time: with `now`
    // (19:00) a bill due today rounded to -1 and fell out of "next 30 days".
    const diff = Math.round((due - todayMid) / 86400000);
    return diff >= 0 && diff <= 30;
  });

  const needs = tx.filter(t => t.type === 'expense' && (cat(t.categoryId)||{}).need === 'need')
    .reduce((s,t) => s + t.amount, 0);
  const wants = tx.filter(t => t.type === 'expense' && (cat(t.categoryId)||{}).need === 'want')
    .reduce((s,t) => s + t.amount, 0);

  const goals = DB.data.goals || [];
  const goalsInProgress = goals.filter(g => g.saved < g.target).length;

  return {
    income, expense, net,
    budgetTotal, budgetSpent, budgetLeft,
    assets, liabilities, netWorth, cashAccounts, creditBal, savingsInv, emergency,
    subMonthly: subCost, subAnnual: subCost * 12,
    billsDueCount: unpaidNow.length,
    billsTotalMonth: billsNow.reduce((s,b) => s + b.amount, 0),
    billsPaidCount: billsNow.length - unpaidNow.length,
    billsUnpaidCount: unpaidNow.length,
    billsPaidAmount: billsNow.filter(b => !unpaidNow.includes(b)).reduce((s,b) => s + b.amount, 0),
    overdueAmount: overdueBills.reduce((s,b) => s + b.amount, 0),
    overdueCount: overdueBills.length,
    upcomingBillsCount: upcoming30.length,
    debtRemaining: liabilities,
    savingsRate: income > 0 ? (net / income) * 100 : 0,
    budgetUsed: budgetTotal > 0 ? (budgetSpent / budgetTotal) * 100 : 0,
    goalsInProgress,
    needs, wants,
    prevIncome: prevTx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0),
    prevExpense: prevTx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0),
    tx
  };
}

/* ---------- Needs attention ---------- */
function attentionItems(){
  const items = [];
  const now = new Date(), todayISOs = iso(now);
  // CURSOR RULE: global, now-facing surface — this never reads UI.month, so
  // paging through history cannot change what the bell reports. One `now`
  // drives every check: bills use the calendar month of today (paidPeriods are
  // calendar keys), budgets use the budget period containing today (the same
  // date when budgetStartDay === 1), subscriptions carry absolute dates.
  const billCursor = monthStart(now);
  const budgetCursor = currentPeriodCursor(now);
  DB.data.bills.forEach(b => {
    const due = billDueDate(b, billCursor);
    const dueISO = iso(due);
    if (!billPaid(b, billCursor)){
      const diff = daysBetween(todayISOs, dueISO);
      if (diff < 0) items.push({level:'overdue', color:'var(--red)', title:`${b.name} is overdue`,
        sub:`${money(b.amount)} was due ${Math.abs(diff)} day${Math.abs(diff)===1?'':'s'} ago`, view:'bills'});
      else if (diff <= 5) items.push({level:'due-soon', color:'var(--amber)', title:`${b.name} due ${diff === 0 ? 'today' : 'in ' + diff + ' day' + (diff===1?'':'s')}`,
        sub:`${money(b.amount)} · ${due.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`, view:'bills'});
    }
  });
  activeSubs().forEach(s => {
    const diff = daysBetween(todayISOs, s.next);
    if (s.trialEnd && diff >= 0 && diff <= 7)
      items.push({level:'alert', color:'var(--amber)', title:`${s.name} trial ends ${diff===0?'today':'soon'}`,
        sub:`Charges ${money(s.amount)} on ${fmtDateShort(s.next)}`, view:'subscriptions'});
    else if (diff === 0)
      items.push({level:'due-soon', color:'var(--amber)', title:`${s.name} renews today`, sub:`${money(s.amount)} ${s.cycle}`, view:'subscriptions'});
  });
  DB.data.categories.filter(c => c.budget > 0).forEach(c => {
    const spent = periodTx(budgetCursor).filter(t => t.type === 'expense' && t.categoryId === c.id)
      .reduce((s,t) => s + t.amount, 0);
    const p = (spent / c.budget) * 100;
    if (p >= 100) items.push({level:'overdue', color:'var(--red)', title:`${c.name} budget exceeded`,
      sub:`${pct(p)} used — ${money(spent - c.budget)} over`, view:'budgets'});
    else if (p >= 75) items.push({level:'due-soon', color:'var(--amber)', title:`${c.name} budget at ${pct(p)}`,
      sub:`${money(c.budget - spent)} left of ${money(c.budget)}`, view:'budgets'});
  });
  const order = {overdue:0, 'due-soon':1, alert:2};
  return items.sort((a,b) => order[a.level] - order[b.level]);
}

/* ---------- Chart engine (canvas) ---------- */
function ctx2d(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || cv.parentElement.clientWidth || 300;
  const h = cv.clientHeight || 180;
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return {c, w, h};
}
function cssVar(name, fallback=''){
  return (getComputedStyle(document.documentElement).getPropertyValue(name) || fallback).trim() || fallback;
}
function chartLine(cv, labels, series, opts={}){
  if (!cv) return;
  const {c, w, h} = ctx2d(cv);
  const padL = 44, padR = opts.endLabels ? 96 : 12, padT = 14, padB = 26;
  const all = series.flatMap(s => s.data);
  let max = Math.max(...all, 1), min = Math.min(...all, 0);
  if (min > 0) min = 0;
  const range = (max - min) || 1;
  max += range * 0.12; min -= range * 0.08;
  const X = i => padL + (i / Math.max(1, labels.length - 1)) * (w - padL - padR);
  const Y = v => padT + (1 - (v - min) / (max - min)) * (h - padT - padB);
  const muted = cssVar('--faint', '#999');
  c.font = "10.5px Inter, sans-serif"; c.fillStyle = muted;
  for (let g = 0; g <= 4; g++){
    const v = min + (max - min) * (g / 4);
    const y = Y(v);
    c.strokeStyle = cssVar('--grid-line', '#eee'); c.lineWidth = 1;
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - padR, y); c.stroke();
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(moneyShort(v), padL - 8, y);
  }
  c.textAlign = 'center'; c.textBaseline = 'top';
  labels.forEach((l, i) => c.fillText(l, X(i), h - padB + 8));
  series.forEach(s => {
    const pts = s.data.map((v, i) => [X(i), Y(v)]);
    if (s.fill){
      const grad = c.createLinearGradient(0, padT, 0, h - padB);
      grad.addColorStop(0, s.color + '33'); grad.addColorStop(1, s.color + '00');
      c.beginPath(); c.moveTo(pts[0][0], h - padB);
      pts.forEach(p => c.lineTo(p[0], p[1]));
      c.lineTo(pts[pts.length-1][0], h - padB); c.closePath();
      c.fillStyle = grad; c.fill();
    }
    c.beginPath();
    pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
    c.strokeStyle = s.color; c.lineWidth = 2.4; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
    pts.forEach(p => {
      c.beginPath(); c.arc(p[0], p[1], 3.4, 0, Math.PI*2);
      c.fillStyle = cssVar('--card', '#fff'); c.fill();
      c.lineWidth = 2; c.strokeStyle = s.color; c.stroke();
    });
  });
  if (opts.endLabels){
    // Editorial direct labels at the line ends — replaces legends
    const placed = [];
    series.forEach(s => {
      const li = s.data.length - 1;
      let y = Y(s.data[li]);
      while (placed.some(py => Math.abs(py - y) < 15)) y += 15;
      placed.push(y);
      c.textAlign = 'left'; c.textBaseline = 'middle';
      c.font = "600 11px Inter, sans-serif";
      c.fillStyle = s.color;
      c.fillText(`${s.name || ''} ${moneyShort(s.data[li])}`.trim(), X(li) + 9, y);
    });
  }
}
function chartDonut(cv, items, centerLabel='', centerValue=''){
  if (!cv) return;
  const {c, w, h} = ctx2d(cv);
  const total = items.reduce((s,i) => s + i.value, 0) || 1;
  const cx = w/2, cy = h/2;
  const r = Math.min(w, h)/2 - 6, r2 = r * 0.64;
  let a = -Math.PI/2;
  items.forEach(i => {
    const ang = (i.value / total) * Math.PI * 2;
    c.beginPath(); c.arc(cx, cy, r, a, a + ang); c.arc(cx, cy, r2, a + ang, a, true); c.closePath();
    c.fillStyle = i.color; c.fill();
    a += ang;
  });
  if (centerValue){
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = cssVar('--text', '#222'); c.font = "700 17px Inter, sans-serif";
    c.fillText(centerValue, cx, cy - 4);
    c.fillStyle = cssVar('--faint', '#999'); c.font = "600 10px Inter, sans-serif";
    c.fillText(centerLabel.toUpperCase(), cx, cy + 14);
  }
}
function chartBars(cv, labels, series, opts={}){
  if (!cv) return;
  const {c, w, h} = ctx2d(cv);
  const padL = 44, padR = 10, padT = 12, padB = 26;
  const max = Math.max(1, ...series.flatMap(s => s.data));
  const groupW = (w - padL - padR) / Math.max(1, labels.length);
  const barW = Math.min(opts.barWidth || 18, (groupW - 8) / series.length);
  const muted = cssVar('--faint', '#999');
  c.font = "10.5px Inter, sans-serif"; c.fillStyle = muted;
  for (let g = 0; g <= 3; g++){
    const v = (max / 3) * g;
    const y = padT + (1 - g/3) * (h - padT - padB);
    c.strokeStyle = cssVar('--grid-line', '#eee'); c.lineWidth = 1;
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - padR, y); c.stroke();
    c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(moneyShort(v), padL - 8, y);
  }
  labels.forEach((l, i) => {
    const gx = padL + groupW * i + groupW/2;
    series.forEach((s, j) => {
      const v = s.data[i] || 0;
      const bh = (v / max) * (h - padT - padB);
      const x = gx - (series.length * barW)/2 + j * barW;
      const y = h - padB - bh;
      c.fillStyle = s.color;
      const r = Math.min(4, barW/2, Math.max(0, bh/2));
      c.beginPath();
      if (c.roundRect) { c.roundRect(x+1, y, barW-2, Math.max(bh, v > 0 ? 2 : 0), r); }
      else { c.rect(x+1, y, barW-2, Math.max(bh, v > 0 ? 2 : 0)); }
      c.fill();
    });
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillStyle = muted;
    const label = String(l).length > 9 ? String(l).slice(0,8) + '…' : String(l);
    c.fillText(label, gx, h - padB + 8);
  });
}

function navBadge(id){
  const today = todayISO();
  switch(id){
    case 'today': { const n = DB.data.transactions.filter(t => t.date === today).length;
      return n ? {n, alert:false} : null; }
    case 'calendar': { const n = eventsFor(today).length; return n ? {n, alert:false} : null; }
    case 'accounts': return {n: DB.data.accounts.length, alert:false};
    case 'transactions': return {n: DB.data.transactions.length, alert:false};
    case 'income': { const n = new Set(DB.data.transactions.filter(t => t.type==='income').map(t => t.categoryId)).size;
      return {n, alert:false}; }
    case 'expenses': { const n = periodTx(UI.month).filter(t => t.type==='expense').length; return n ? {n, alert:false} : null; }
    case 'budgets': { const over = DB.data.categories.filter(c => {
        const spent = periodTx(UI.month).filter(t => t.type==='expense' && t.categoryId===c.id).reduce((s,t)=>s+t.amount,0);
        return c.budget > 0 && spent >= c.budget * 0.75; }).length;
      return over ? {n: over, alert: true} : null; }
    case 'bills': { const unpaid = DB.data.bills.filter(b => !(b.paidPeriods||[]).includes(dayKey(new Date()))).length;
      return unpaid ? {n: unpaid, alert: false} : null; }
    case 'subscriptions': return {n: activeSubs().length, alert:false};
    case 'billcalendar': { const n = DB.data.bills.length + activeSubs().length; return {n, alert:false}; }
    default: return null;
  }
}

/* ========== View 2: Today ========== */
VIEWS.today = {
  render(){
    const today = todayISO();
    const now = new Date();
    const txToday = DB.data.transactions.filter(t => t.date === today)
      .sort((a,b) => (b.type==='income'?1:0) - (a.type==='income'?1:0));

    const tasks = attentionItems().slice(0, 6);
    const inflow = txToday.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
    const outflow = txToday.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);

    const rows = txToday.length ? txToday.map(t => {
      const a = acct(t.accountId) || {name:'—'};
      return `<tr>
        <td class="font-semibold">${esc(t.desc)}</td>

      </tr>`;
    }).join('') : `<tr><td colspan="5">${emptyState('No transactions recorded today. Add one with Quick Add.', 'plus-circle')}</td></tr>`;

    const checklist = [
      ...billsToday.map(b => ({kind:'bill', id:b.id, name:b.name, amount:b.amount, paid:(b.paidPeriods||[]).includes(dayKey(new Date())), autopay:b.autopay})),

      : `<div class="list-row"><div class="muted text-[13px]">No bills or renewals due today.</div></div>`;

      <div class="flex items-start gap-2.5 py-2">
        <span class="dot mt-1.5" style="background:${t.color}"></span>

      </div>`).join('') : `<div class="muted text-[13px] py-2">No reminders.</div>`;

/* ========== Calendar engine (shared by Calendar + Bill Calendar) ========== */
function calendarGridHTML(opts={}){
  const cur = UI.month;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y, m, 1);
  const lead = (first.getDay() + 6) % 7; // Monday-first
  const days = dim(y, m);
  const today = todayISO();
  const cells = [];
  for (let i = 0; i < lead; i++){
    const d = addDays(first, i - lead);
    cells.push({d, muted:true});
  }
  for (let d = 1; d <= days; d++) cells.push({d: new Date(y, m, d), muted:false});
  while (cells.length % 7 !== 0){
    const last = cells[cells.length-1].d;
    cells.push({d: addDays(last, 1), muted:true});
  }
  const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const html = `
    <div class="cal-grid">
      ${dows.map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells.map(c => {
        const dISO = iso(c.d);
        let ev = eventsFor(dISO);
        if (opts.billsOnly) ev = ev.filter(e => e.kind === 'bill' || e.kind === 'bill-paid' || e.kind === 'sub');
        const shown = ev.slice(0, 3);
        const extra = ev.length - shown.length;
        return `<div class="cal-cell ${c.muted ? 'muted' : ''} ${dISO === today ? 'today' : ''}" data-action="cal-day" data-date="${dISO}">
          <div class="cal-daynum">${c.d.getDate()}</div>
          ${shown.map(e => {
            const st = EV_STYLE[e.kind] || EV_STYLE.transfer;
            return `<div class="cal-ev" style="background:${st.bg};color:${st.fg}" title="${esc(e.label)} ${money(e.amount)}">
              <span class="truncate">${esc(e.label)}</span></div>`;
          }).join('')}
          ${extra > 0 ? `<div class="text-[10.5px] faint font-semibold pl-1">+${extra} more</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  return html;
}
function agendaListHTML(billsOnly=false){
  const cur = UI.month, now = new Date();
  // Walk whole calendar days: `end` is the last day of the month at 00:00, so a
  // start carrying the current time-of-day would run past it and silently drop
  // the final day (and empty the whole agenda when today *is* that last day).
  const end = new Date(cur.getFullYear(), cur.getMonth()+1, 0);
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start = (dayKey(now) === dayKey(cur)) ? todayMid : new Date(cur.getFullYear(), cur.getMonth(), 1);
  const items = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)){
    const dISO = iso(d);
    let ev = eventsFor(dISO);
    if (billsOnly) ev = ev.filter(e => e.kind === 'bill' || e.kind === 'bill-paid' || e.kind === 'sub');
    ev.forEach(e => items.push({dISO, d:new Date(d), e}));
  }
  if (!items.length) return emptyState('Nothing scheduled for the rest of this month.', 'calendar');
  return items.map(({dISO, d, e}) => {
    const st = EV_STYLE[e.kind] || EV_STYLE.transfer;
    return `<div class="flex gap-3 items-start py-2.5">
      <div class="w-[52px] shrink-0 text-center">
        <div class="text-[15px] font-bold leading-none tnum">${d.getDate()}</div>
        <div class="faint text-[10.5px] font-semibold uppercase">${MON3[d.getMonth()]}</div>
      </div>
      <div class="w-px self-stretch" style="background:var(--border)"></div>
      <span class="dot mt-1.5" style="background:${st.fg}"></span>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[13px]">${esc(e.label)}</div>
        <div class="text-[11.5px] muted">${e.kind.startsWith('bill') ? 'Recurring bill' : e.kind === 'sub' ? 'Subscription renewal' : e.kind === 'income' ? 'Income event' : 'Expense'}</div>
      </div>
      <span class="tnum font-bold text-[13px]" style="color:${st.fg}">${money(e.amount)}</span>
    </div>`;
  }).join('');
}
function calendarLegend(){
  const items = [

function txFilters(){
  const f = UI.tx;
  let list = DB.data.transactions.slice();
  if (f.q){ const q = f.q.toLowerCase();
    list = list.filter(t => t.desc.toLowerCase().includes(q) || catName(t.categoryId).toLowerCase().includes(q) ||
      (t.tags||[]).some(x => x.toLowerCase().includes(q))); }
  if (f.cat !== 'all') list = list.filter(t => t.categoryId === f.cat);
  if (f.acc !== 'all') list = list.filter(t => t.accountId === f.acc || t.toAccountId === f.acc);
  if (f.type !== 'all') list = list.filter(t => t.type === f.type);
  const now = new Date();
  if (f.range === 'month'){ const {start, end} = periodRange(UI.month); list = list.filter(t => inRange(t.date, start, end)); }
  else if (f.range === '30d'){ const from = iso(addDays(now, -30)); list = list.filter(t => t.date >= from); }
  else if (f.range === 'ytd'){ const from = iso(new Date(now.getFullYear(), 0, 1)); list = list.filter(t => t.date >= from); }
  else if (f.range === 'custom' && f.from) list = list.filter(t => t.date >= f.from && (!f.to || t.date <= f.to));
  const dir = f.dir === 'asc' ? 1 : -1;
  list.sort((a,b) => {
    if (f.sort === 'amount') return (a.amount - b.amount) * dir;
    if (f.sort === 'desc') return a.desc.localeCompare(b.desc) * dir;
    if (f.sort === 'category') return catName(a.categoryId).localeCompare(catName(b.categoryId)) * dir;
    return (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * dir;
  });
  return list;
}

/* ========== View 9: Spending Tracker ========== */
VIEWS.spending = {
  render(){
    const m = metrics();
    const cur = UI.month, now = new Date();
    const curTx = m.tx.filter(t => t.type === 'expense');
    const total = curTx.reduce((s,t) => s + t.amount, 0);
    const elapsed = isCurrentPeriod(cur) ? daysElapsedInPeriod() : periodDays(cur);
    const totalDays = periodDays(cur);
    const dailyAvg = total / Math.max(1, elapsed);
    const projected = dailyAvg * totalDays;
    const prevTx = periodTx(addMonths(cur, -1)).filter(t => t.type === 'expense');
    const prevTotal = prevTx.reduce((s,t) => s + t.amount, 0);
    const delta = prevTotal ? ((total - prevTotal) / prevTotal) * 100 : 0;

    const byDay = {};
    curTx.forEach(t => { byDay[t.date] = (byDay[t.date]||0) + t.amount; });
    const topDays = Object.entries(byDay).sort((a,b) => b[1]-a[1]).slice(0, 5);
    const byMerchant = {};
    curTx.forEach(t => { byMerchant[t.desc] = (byMerchant[t.desc]||0) + t.amount; });
    const merchants = Object.entries(byMerchant).sort((a,b) => b[1]-a[1]).slice(0, 8);
    const maxMerchant = merchants.length ? merchants[0][1] : 1;

    const byCat = {};
    curTx.forEach(t => { byCat[t.categoryId] = (byCat[t.categoryId]||0) + t.amount; });
    const byCatPrev = {};
    prevTx.forEach(t => { byCatPrev[t.categoryId] = (byCatPrev[t.categoryId]||0) + t.amount; });
    const topCats = Object.entries(byCat).sort((a,b) => b[1]-a[1]).slice(0, 6);

    return shell(`
      <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
        <div>
          <div class="eyebrow mb-1">Budgeting · Analytics</div>
          <h1 class="text-[26px] font-extrabold tracking-tight leading-none">Spending Tracker</h1>
        </div>
        <span class="chip">${ic('calendar','w-3 h-3')} ${MONTHS[cur.getMonth()]} ${cur.getFullYear()} · day ${elapsed} of ${totalDays}</span>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        ${kpiTile('Daily Average Burn', money(dailyAvg), `${totalDays - elapsed} days remaining`, 'flame', 'amber')}
        ${kpiTile('Projected Month-End', money(projected), prevTotal ? `${Math.abs(delta).toFixed(0)}% vs last month` : 'first tracked month', 'crosshair', projected > m.budgetTotal ? 'red' : 'neutral')}
        ${kpiTile('Top Spending Day', topDays.length ? money(topDays[0][1]) : money(0), topDays.length ? fmtDateShort(topDays[0][0]) : '—', 'zap', 'red')}
        ${kpiTile('Period Total Spend', money(total), `prev period ${money(prevTotal)}`, 'shopping-cart', 'red')}
      </div>

      <div class="grid lg:grid-cols-2 gap-4 mb-6">
        <div class="card p-4">
          ${sectionHead('Daily Spend Velocity', `<span class="chip">last ${elapsed} days</span>`)}
          <canvas id="ch-daily" style="width:100%;height:220px"></canvas>
        </div>
        <div class="card p-4">
          ${sectionHead('Month-over-Month by Category', `
            <span class="flex gap-3 text-[11.5px] muted">
              <span class="flex items-center gap-1.5"><span class="dot" style="background:var(--accent)"></span>This</span>
              <span class="flex items-center gap-1.5"><span class="dot" style="background:var(--faint)"></span>Prev</span>
            </span>`)}
          <canvas id="ch-mom" style="width:100%;height:220px"></canvas>
        </div>
      </div>

      <div class="grid lg:grid-cols-2 gap-4">
        <div class="card p-4">
          ${sectionHead('Top Spending Velocity Days')}
          <div class="flex flex-col gap-2">
            ${topDays.length ? topDays.map(([d, v], i) => `
              <div class="list-row">
                <span class="badge ${i===0?'badge-red':'badge-neutral'}">#${i+1}</span>
                <div class="flex-1 min-w-0">
                  <div class="font-semibold text-[13px]">${fmtDate(d)}</div>
                  <div class="progress mt-1.5"><span style="width:${(v/topDays[0][1])*100}%;background:var(--red)"></span></div>
                </div>
                <span class="tnum font-bold text-[13px]" style="color:var(--red)">${money(v)}</span>
              </div>`).join('') : `<p class="muted text-[13px]">No spending recorded this period.</p>`}
          </div>
        </div>
        <div class="card p-4">
          ${sectionHead('Merchant Leaderboard')}
          <div class="flex flex-col gap-2">
            ${merchants.length ? merchants.map(([name, v], i) => `
              <div class="list-row">
                <span class="w-5 text-center faint font-bold text-[12px] tnum">${i+1}</span>
                <div class="flex-1 min-w-0">
                  <div class="font-semibold text-[13px] truncate">${esc(name)}</div>
                  <div class="progress mt-1.5"><span style="width:${(v/maxMerchant)*100}%;background:var(--accent)"></span></div>
                </div>
                <span class="tnum font-bold text-[13px]">${money(v)}</span>
              </div>`).join('') : `<p class="muted text-[13px]">No merchants yet.</p>`}
          </div>
        </div>
      </div>`);
  },
  mount(){
    const curTx = periodTx(UI.month).filter(t => t.type === 'expense');
    const prevTx = periodTx(addMonths(UI.month, -1)).filter(t => t.type === 'expense');
    const elapsed = isCurrentPeriod(UI.month) ? daysElapsedInPeriod() : periodDays(UI.month);
    const {start} = periodRange(UI.month);
    const daily = [], labels = [];
    for (let i = 0; i < elapsed; i++){
      const dISO = iso(addDays(start, i));
      labels.push(String(parseISO(dISO).getDate()));
      daily.push(curTx.filter(t => t.date === dISO).reduce((s,t) => s + t.amount, 0));
    }
    chartBars($('#ch-daily'), labels, [{data: daily, color: cssVar('--red', '#c2382c')}], {barWidth: 14});

    const byCat = {}, byCatPrev = {};
    curTx.forEach(t => { byCat[t.categoryId] = (byCat[t.categoryId]||0) + t.amount; });
    prevTx.forEach(t => { byCatPrev[t.categoryId] = (byCatPrev[t.categoryId]||0) + t.amount; });
    const top = Object.entries(byCat).sort((a,b) => b[1]-a[1]).slice(0, 6).map(([id]) => id);
    chartBars($('#ch-mom'), top.map(id => catName(id)), [
      {data: top.map(id => byCat[id] || 0), color: cssVar('--accent', '#49111c')},
      {data: top.map(id => byCatPrev[id] || 0), color: cssVar('--faint', '#999')}
    ], {barWidth: 20});
  }
};

/* ========== View 10: Bills ========== */
VIEWS.bills = {
  render(){
    const m = metrics();
    const now = new Date();
    const bills = DB.data.bills.slice().sort((a,b) => a.dueDay - b.dueDay);
    // Bills are calendar-month obligations: the due date, the paid state and the
    // status badge must all be computed for the *current* month — the same key
    // setBillPaid() writes. Mixing cursors made a card read "due Oct 1" while its
    // badge was evaluated against the month selected in the top bar. Browsing
    // other months is what the Bill Calendar view is for.
    const billsMonth = monthStart(now);
    const cards = bills.length ? bills.map(b => {
      const status = billStatus(b, billsMonth);
      const paid = status === 'paid';
      const due = billDueDate(b, billsMonth);
      const badge = paid ? `<span class="badge badge-green">Paid</span>`
        : status === 'overdue' ? `<span class="badge badge-red">Overdue</span>`
        : status === 'due-soon' ? `<span class="badge badge-amber">Due soon</span>`
        : `<span class="badge badge-neutral">Upcoming</span>`;

VIEWS.subscriptions = {
  render(){
    const subs = DB.data.subscriptions.slice().sort((a,b) => a.next < b.next ? -1 : 1);
    const act = activeSubs();
    const monthly = act.reduce((s,x) => s + subMonthly(x), 0);
    const most = act.slice().sort((a,b) => subMonthly(b) - subMonthly(a))[0];
    const now = todayISO();

    const subCard = s => {
      const days = daysBetween(now, s.next);
      const trialSoon = s.trialEnd && daysBetween(now, s.trialEnd) >= 0 && daysBetween(now, s.trialEnd) <= 7;
      // `days < 0` means the renewal date has already passed. The old ternary
      // folded it into "renews today", so a stale date read as a live renewal.
      const renewIn = days < 0 ? `renewal ${Math.abs(days)}d overdue`
        : days === 0 ? 'renews today'
        : days === 1 ? 'renews tomorrow'
        : `renews in ${days}d`;
      return `<div class="card card-hover p-4" style="${trialSoon ? 'border-color:var(--amber)' : ''}">
        <div class="flex items-start justify-between gap-3 mb-3">
          <div class="flex items-start gap-2.5 min-w-0">
            <span class="avatar-ic" style="background:var(--accent-soft);color:var(--text)">${ic('repeat','w-4 h-4')}</span>
            <div class="min-w-0">
              <div class="font-bold text-[14px] truncate ${s.active ? '' : 'line-through opacity-60'}">${esc(s.name)}</div>
              <div class="text-[11.5px] muted">${esc(catName(s.categoryId))} · ${s.cycle}</div>
            </div>
          </div>
          ${!s.active ? `<span class="badge badge-neutral">Cancelled</span>`
            : trialSoon ? `<span class="badge badge-amber">Trial ends ${fmtDateShort(s.trialEnd)}</span>`
            : days < 0 ? `<span class="badge badge-red">${renewIn}</span>`
            : days <= 7 ? `<span class="badge badge-amber">${renewIn}</span>`
            : `<span class="badge badge-green">Active</span>`}
        </div>
        <div class="flex items-end justify-between gap-3">
          <div>
            <div class="stat-value tnum">${money(s.amount)}</div>
            <div class="text-[11.5px] muted mt-0.5">${s.cycle === 'annual' ? money(subMonthly(s)) + '/mo effective' : 'per month'} · next ${fmtDateShort(s.next)}</div>
          </div>
          <div class="flex flex-col items-end gap-1.5">
            <button class="chip" data-action="sub-reminder" data-id="${s.id}" title="Toggle cancellation reminder"
              style="${s.reminder ? 'border-color:var(--amber);color:var(--amber)' : ''}">
              ${ic('bell', 'w-3 h-3')} ${s.reminder ? 'reminder on' : 'reminder off'}</button>

              <button class="icon-btn sm" data-action="sub-edit" data-id="${s.id}">${ic('pencil','w-3.5 h-3.5')}</button>
              <button class="icon-btn sm" data-action="sub-del" data-id="${s.id}">${ic('trash-2','w-3.5 h-3.5')}</button>
            </div>
          </div>
        </div>
      </div>`;
    };

    const monthlyList = subs.filter(s => s.cycle !== 'annual');
    const annualList = subs.filter(s => s.cycle === 'annual');

    return shell(`
      <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
        <div>
          <div class="eyebrow mb-1">Obligations</div>
          <h1 class="text-[26px] font-extrabold tracking-tight leading-none">Subscriptions</h1>
        </div>
        <button class="btn btn-primary" data-action="quick-add" data-tab="subscription">${ic('plus','w-4 h-4')}Add Subscription</button>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        ${kpiTile('Active Subscriptions', String(act.length), `${subs.length} total tracked`, 'repeat', 'neutral')}
        ${kpiTile('Monthly Recurring Cost', money(monthly), 'incl. annual amortized', 'credit-card', 'red')}
        ${kpiTile('Annualized Cost', money(monthly * 12), 'at current cadence', 'calendar', 'amber')}
        ${kpiTile('Most Expensive', most ? money(most.amount) : money(0), most ? most.name : '—', 'crown', 'amber')}
      </div>

      <div class="mb-6">
        ${sectionHead('Monthly Cycle', `<span class="chip">${monthlyList.length} items</span>`)}
        <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
          ${monthlyList.length ? monthlyList.map(subCard).join('') : `<p class="muted text-[13px]">No monthly subscriptions.</p>`}
        </div>
      </div>

      <div>
        ${sectionHead('Annual Cycle', `<span class="chip">${annualList.length} items</span>`)}
        <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
          ${annualList.length ? annualList.map(subCard).join('') : `<p class="muted text-[13px]">No annual subscriptions.</p>`}
        </div>
      </div>`);
  },
  mount(){}
};

  mount(){

/* ---------- Modal engine ---------- */
let pendingConfirm = null;
function openModal(html, narrow=false){
  const root = $('#modal-root'), panel = $('#modal-panel');
  panel.className = 'modal-panel' + (narrow ? ' narrow' : '');
  panel.innerHTML = html;
  root.classList.add('open');
  document.body.style.overflow = 'hidden';
  icons(panel);
  const first = panel.querySelector('input:not([type=hidden]), select, textarea');
  if (first) setTimeout(() => { try { first.focus(); } catch(e){} }, 60);
}
function closeModal(){
  $('#modal-root').classList.remove('open');
  $('#modal-panel').innerHTML = '';
  document.body.style.overflow = '';
  pendingConfirm = null;
}

/* ---------- Data mutations ---------- */
function saveTransaction(t){
  const existing = DB.data.transactions.findIndex(x => x.id === t.id);
  if (existing >= 0){
    DB.data.transactions[existing] = t;
    toast('Transaction updated');
  } else {
    DB.data.transactions.push(t);
    toast('Transaction added');
  }
  syncBalances();
  DB.save();
}
function deleteTransaction(id){
  const i = DB.data.transactions.findIndex(t => t.id === id);
  if (i < 0) return;
  DB.data.transactions.splice(i, 1);
  UI.tx.sel.delete(id);
  syncBalances();
  DB.save();
  toast('Transaction deleted');
}
function duplicateTransaction(id){
  const t = DB.data.transactions.find(x => x.id === id);
  if (!t) return;
  const copy = Object.assign({}, t, {id: uid(), date: todayISO()});
  saveTransaction(copy);
  toast('Transaction duplicated');
}
function setBillPaid(id, paid){
  const b = DB.data.bills.find(x => x.id === id);
  if (!b) return;
  const key = dayKey(new Date()); // bill check-offs always mean "current billing month"
  b.paidPeriods = b.paidPeriods || [];
  if (paid && !b.paidPeriods.includes(key)) b.paidPeriods.push(key);
  if (!paid) b.paidPeriods = b.paidPeriods.filter(k => k !== key);
  DB.save();
  toast(paid ? `${b.name} marked paid` : `${b.name} marked unpaid`, paid ? 'ok' : '');
}
function importFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!DB.validate(parsed)){ toast('Invalid file: missing required data structure', 'err'); return; }
      DB.data = DB.normalize(parsed);
      syncBalances(DB.data);
      DB.save();
      applyTheme(DB.data.settings.theme);
      UI.month = currentPeriodCursor();
      renderAll();
      toast('Data imported successfully', 'ok');
    } catch(e){ toast('Could not parse that JSON file', 'err'); }
  };
  reader.readAsText(file);
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB.data, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'personal_finance_data.json');
  toast('Backup downloaded', 'ok');
}
function exportCSV(){
  const rows = [['Date','Description','Type','Category','Account','Amount','Tags']];
  DB.data.transactions.forEach(t => rows.push([
    t.date, t.desc, t.type, catName(t.categoryId), (acct(t.accountId)||{}).name || '',
    (t.type === 'income' ? '' : '-') + t.amount, (t.tags||[]).join('|')
  ]));
  const csv = rows.map(r => r.map(v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  downloadBlob(new Blob([csv], {type:'text/csv'}), 'personal_finance_transactions.csv');
  toast('CSV exported', 'ok');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme || 'light');
}
