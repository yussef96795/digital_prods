/* ---------- Form submissions ---------- */
document.addEventListener('submit', e => {
  const form = e.target;
  const kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const fd = new FormData(form);
  const val = n => (fd.get(n) == null ? '' : String(fd.get(n)).trim());

  if (kind === 'transaction'){
    const amount = parseFloat(val('amount'));
    if (!Number.isFinite(amount) || amount <= 0) return toast('Enter a valid amount', 'err');
    const type = val('type');
    let categoryId = val('categoryId');
    if (type === 'transfer'){
      categoryId = categoryId || (DB.data.categories.find(x => x.kind === 'expense') || {}).id || '';
    } else {
      const c = cat(categoryId);
      if (!c || c.kind !== type) categoryId = (DB.data.categories.find(x => x.kind === type) || {}).id;
      if (!categoryId) return toast('Create a matching category first', 'err');
    }
    const t = {
      id: val('id') || uid(),
      date: val('date') || todayISO(),
      desc: val('desc') || 'Untitled',
      amount: Math.round(amount * 100) / 100,
      categoryId, accountId: val('accountId'),
      type,
      tags: val('tags') ? val('tags').split(',').map(s => s.trim()).filter(Boolean) : []
    };
    if (type === 'transfer') t.toAccountId = val('toAccountId');
    saveTransaction(t);
    closeModal(); renderAll();
    return;
  }

  if (kind === 'bill'){
    const amount = parseFloat(val('amount'));
    if (!Number.isFinite(amount) || amount <= 0) return toast('Enter a valid amount', 'err');
    const id = val('id');
    const data = {
      id: id || uid(), name: val('name') || 'Bill', amount: Math.round(amount*100)/100,
      dueDay: clamp(parseInt(val('dueDay')) || 1, 1, 31), categoryId: val('categoryId'),
      accountId: val('accountId'), autopay: fd.get('autopay') === 'on'
    };
    const i = DB.data.bills.findIndex(b => b.id === id);
    if (i >= 0){ DB.data.bills[i] = Object.assign(DB.data.bills[i], data); toast('Bill updated'); }
    else { data.paidPeriods = []; DB.data.bills.push(data); toast('Bill added'); }
    DB.save(); closeModal(); renderAll();
    return;
  }

  if (kind === 'subscription'){
    const amount = parseFloat(val('amount'));
    if (!Number.isFinite(amount) || amount <= 0) return toast('Enter a valid amount', 'err');
    const id = val('id');
    const data = {
      id: id || uid(), name: val('name') || 'Subscription', amount: Math.round(amount*100)/100,
      cycle: val('cycle'), next: val('next') || todayISO(), categoryId: val('categoryId'),
      trialEnd: val('trialEnd') || undefined,
      active: fd.get('active') === 'on', reminder: fd.get('reminder') === 'on'
    };
    const i = DB.data.subscriptions.findIndex(s => s.id === id);
    if (i >= 0){ DB.data.subscriptions[i] = Object.assign(DB.data.subscriptions[i], data); toast('Subscription updated'); }
    else { DB.data.subscriptions.push(data); toast('Subscription added'); }
    DB.save(); closeModal(); renderAll();
    return;
  }

  if (kind === 'category'){
    const id = val('id');
    const data = {
      id: id || uid(), name: val('name') || 'Category', kind: val('kind') || 'expense',
      icon: val('icon') || 'folder', color: val('color') || COLOR_SET[0],
      need: val('need') || null, budget: parseFloat(val('budget')) || null
    };
    const i = DB.data.categories.findIndex(c => c.id === id);
    if (i >= 0){ DB.data.categories[i] = Object.assign(DB.data.categories[i], data); toast('Category updated'); }
    else { DB.data.categories.push(data); toast('Category created'); }
    DB.save(); closeModal(); renderAll();
    return;
  }

  if (kind === 'account'){
    const balance = parseFloat(val('balance'));
    if (!Number.isFinite(balance)) return toast('Enter a valid balance', 'err');
    const id = val('id');
    const data = {
      id: id || uid(), name: val('name') || 'Account', institution: val('institution') || 'Custom',
      type: val('type'), balance: Math.round(balance*100)/100, emergency: fd.get('emergency') === 'on'
    };
    // Balances reconcile with the ledger: the user sets the current balance,
    // so we derive an opening balance consistent with recorded movements.
    data.openingBalance = Math.round((data.balance - netMovementsFor(DB.data.transactions, id || data.id)) * 100) / 100;
    const i = DB.data.accounts.findIndex(a => a.id === id);
    if (i >= 0){ DB.data.accounts[i] = Object.assign(DB.data.accounts[i], data); toast('Account updated'); }
    else { DB.data.accounts.push(data); toast('Account added'); }
    syncBalances(); DB.save(); closeModal(); renderAll();
    return;
  }

  if (kind === 'settings'){
    DB.data.settings.currency = val('currency') || 'USD';
    DB.data.settings.customSymbol = val('customSymbol') || '$';
    DB.data.settings.budgetStartDay = clamp(parseInt(val('budgetStartDay')) || 1, 1, 31);
    DB.save(); renderAll();
    toast('Preferences saved', 'ok');
    return;
  }

  if (kind === 'tag'){
    const t = val('tag');
    if (!t) return;
    if (DB.data.settings.tags.includes(t)) return toast('Tag already exists', 'err');
    DB.data.settings.tags.push(t);
    DB.save(); renderAll();
    toast('Tag added', 'ok');
    return;
  }

  if (kind === 'bulkcat'){
    const cid = val('categoryId');
    let n = 0;
    DB.data.transactions.forEach(t => { if (UI.tx.sel.has(t.id)){ t.categoryId = cid; n++; } });
    DB.save(); UI.tx.sel.clear(); closeModal(); renderAll();
    toast(`${n} transaction${n===1?'':'s'} recategorized`, 'ok');
  }
});

/* ---------- Click delegation ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (UI.searchOpen && !e.target.closest('#global-search')){ UI.searchOpen = false; renderSearchPop(); }
    if (UI.notifOpen && !e.target.closest('#notif-pop') && !e.target.closest('[data-action="toggle-notif"]')){
      UI.notifOpen = false; renderTopbar();
    }
    return;
  }
  const a = el.dataset.action;
  const id = el.dataset.id;

  switch(a){
    case 'nav': setView(el.dataset.view); break;
    case 'notif-go': setView(el.dataset.view); break;
    case 'collapse-sidebar':
      UI.sidebarCollapsed = !UI.sidebarCollapsed;
      try { localStorage.setItem('PFM_PRO_SIDEBAR', UI.sidebarCollapsed ? '1' : '0'); } catch(err){}
      renderSidebar(); break;
    case 'mobile-sidebar':
      UI.sidebarMobileOpen = !UI.sidebarMobileOpen; renderSidebar(); break;
    case 'month-prev': UI.month = addMonths(UI.month, -1); renderAll(); break;
    case 'month-next': UI.month = addMonths(UI.month, 1); renderAll(); break;
    case 'month-today': UI.month = monthStart(new Date()); renderAll(); break;
    case 'theme-toggle': {
      const th = DB.data.settings.theme;
      const next = th === 'dark' ? 'light' : 'dark';
      DB.data.settings.theme = next; DB.save(); applyTheme(next); renderAll();
      break;
    }
    case 'set-theme':
      DB.data.settings.theme = el.dataset.theme; DB.save();
      applyTheme(el.dataset.theme); renderAll();
      toast(`Theme: ${el.dataset.theme}`);
      break;
    case 'quick-add': openQuickAdd(el.dataset.tab || 'transaction', {date: el.dataset.date, kind: el.dataset.kind, type: el.dataset.type}); break;
    case 'quick-tab': openQuickAdd(el.dataset.tab); break;
    case 'toggle-notif': UI.notifOpen = !UI.notifOpen; renderTopbar(); break;
    case 'modal-close': closeModal(); break;
    case 'confirm-yes': { const cb = pendingConfirm; closeModal(); if (cb) cb(); break; }

    case 'cal-day': openDayModal(el.dataset.date); break;

    case 'tx-edit': { const t = DB.data.transactions.find(x => x.id === id); if (t) openModal(txFormHTML(t)); break; }
    case 'tx-del':
      confirmModal({title:'Delete transaction?', message:'This will also reverse its effect on the account balance.',
        confirmText:'Delete', danger:true, onConfirm(){ deleteTransaction(id); renderAll(); }});
      break;
    case 'tx-dup': duplicateTransaction(id); renderAll(); break;
    case 'tx-sort': {
      const k = el.dataset.key;
      if (UI.tx.sort === k) UI.tx.dir = UI.tx.dir === 'asc' ? 'desc' : 'asc';
      else { UI.tx.sort = k; UI.tx.dir = k === 'date' ? 'desc' : 'asc'; }
      renderView(); break;
    }
    case 'tx-page': UI.tx.page = parseInt(el.dataset.page) || 1; renderView(); $('#view').scrollTop = 0; break;
    case 'select-page': {
      const f = UI.tx;
      const perPage = 10;
      const all = txFilters();
      const page = all.slice((f.page-1)*perPage, f.page*perPage);
      const allSel = page.every(t => f.sel.has(t.id));
      page.forEach(t => allSel ? f.sel.delete(t.id) : f.sel.add(t.id));
      renderView(); break;
    }
    case 'bulk-delete':
      confirmModal({title:`Delete ${UI.tx.sel.size} transactions?`, message:'Selected entries will be removed and balances reversed.',
        confirmText:'Delete all', danger:true, onConfirm(){
          Array.from(UI.tx.sel).forEach(tid => deleteTransaction(tid));
          UI.tx.sel.clear(); renderAll();
        }});
      break;
    case 'bulk-categorize':
      openModal(`${modalHeader('Recategorize selection', 'Bulk action')}
        <form data-form="bulkcat" class="px-5 pb-5">
          <label class="fld">Move ${UI.tx.sel.size} selected transactions to</label>
          <select class="inp" name="categoryId">${DB.data.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
          <div class="flex justify-end gap-2 mt-5">
            <button class="btn" type="button" data-action="modal-close">Cancel</button>
            <button class="btn btn-primary" type="submit">Apply</button>
          </div>
        </form>`, true);
      break;
    case 'bulk-clear': UI.tx.sel.clear(); renderView(); break;

    case 'acct-edit': { const acc = DB.data.accounts.find(x => x.id === id); if (acc) openModal(acctFormHTML(acc)); break; }
    case 'acct-del': {
      const acc = DB.data.accounts.find(x => x.id === id);
      if (!acc) break;
      confirmModal({title:`Delete ${acc.name}?`, message:'Its transactions will remain but show no account.',
        confirmText:'Delete', danger:true, onConfirm(){
          DB.data.accounts = DB.data.accounts.filter(x => x.id !== id);
          DB.save(); renderAll(); toast('Account deleted');
        }});
      break;
    }
    case 'cat-edit': { const c = cat(id); if (c) openModal(catFormHTML(c)); break; }
    case 'cat-del': {
      const c = cat(id);
      if (!c) break;
      const used = DB.data.transactions.filter(t => t.categoryId === id).length;
      confirmModal({title:`Delete ${c.name}?`, message:`${used} transaction${used===1?'':'s'} use this category — they will become uncategorized.`,
        confirmText:'Delete', danger:true, onConfirm(){
          DB.data.categories = DB.data.categories.filter(x => x.id !== id);
          DB.save(); renderAll(); toast('Category deleted');
        }});
      break;
    }
    case 'bill-edit': { const b = DB.data.bills.find(x => x.id === id); if (b) openModal(billFormHTML(b)); break; }
    case 'bill-del': {
      const b = DB.data.bills.find(x => x.id === id);
      if (!b) break;
      confirmModal({title:`Delete ${b.name}?`, message:'This recurring bill will no longer appear in your calendar.',
        confirmText:'Delete', danger:true, onConfirm(){
          DB.data.bills = DB.data.bills.filter(x => x.id !== id);
          DB.save(); renderAll(); toast('Bill deleted');
        }});
      break;
    }
    case 'sub-edit': { const s = DB.data.subscriptions.find(x => x.id === id); if (s) openModal(subFormHTML(s)); break; }
    case 'sub-del': {
      const s = DB.data.subscriptions.find(x => x.id === id);
      if (!s) break;
      confirmModal({title:`Delete ${s.name}?`, message:'The subscription will be removed from analytics.',
        confirmText:'Delete', danger:true, onConfirm(){
          DB.data.subscriptions = DB.data.subscriptions.filter(x => x.id !== id);
          DB.save(); renderAll(); toast('Subscription deleted');
        }});
      break;
    }
    case 'sub-reminder': {
      const s = DB.data.subscriptions.find(x => x.id === id);
      if (s){ s.reminder = !s.reminder; DB.save(); renderAll(); toast(s.reminder ? 'Reminder enabled' : 'Reminder disabled'); }
      break;
    }
    case 'tag-del':
      DB.data.settings.tags = DB.data.settings.tags.filter(t => t !== el.dataset.tag);
      DB.save(); renderAll();
      break;

    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import-trigger': $('#import-file').click(); break;
    case 'factory-reset':
      UI.resetDemo = false; // default: start empty
      confirmModal({title:'Factory reset local data?', danger:true, confirmText:'Purge everything',
        message:'All transactions, accounts, categories and preferences stored in this browser will be destroyed.',
        extraHtml:`<label class="list-row cursor-pointer mb-4">
            <input type="checkbox" class="accent-[var(--green)] w-4 h-4" id="reset-demo">
            <span class="text-[13px] font-semibold">Reload sample demo data afterwards (unchecked = start empty)</span></label>`,
        onConfirm(){
          // The confirm modal is closed before this runs, so the checkbox value was
          // captured by the document 'change' listener into UI.resetDemo.
          const demo = !!UI.resetDemo;
          DB.reset(demo);
          UI.resetDemo = false;
          UI.month = monthStart(new Date());
          UI.tx = { q:'', cat:'all', acc:'all', type:'all', range:'month', from:'', to:'', sort:'date', dir:'desc', page:1, sel:new Set() };
          applyTheme(DB.data.settings.theme);
          setView('dashboard');
          toast(demo ? 'Factory reset complete — sample data loaded' : 'Factory reset complete — starting empty', 'ok');
        }});
      break;

    case 'search-go': {
      const kind = el.dataset.kind;
      UI.searchOpen = false; UI.searchQ = '';
      if (kind === 'tx'){
        const t = DB.data.transactions.find(x => x.id === id);
        UI.tx.q = t ? t.desc : ''; UI.tx.range = 'all'; UI.tx.page = 1;
        setView('transactions');
      } else if (kind === 'bill'){ setView('bills'); openModal(billFormHTML(DB.data.bills.find(x => x.id === id))); }
      else if (kind === 'account'){ setView('accounts'); openModal(acctFormHTML(DB.data.accounts.find(x => x.id === id))); }
      else if (kind === 'sub'){ setView('subscriptions'); openModal(subFormHTML(DB.data.subscriptions.find(x => x.id === id))); }
      break;
    }
    default: break;
  }
});

/* ---------- Change / input delegation ---------- */
let refocusSelector = null;
function rerenderKeepFocus(selector){
  refocusSelector = selector;
  renderView();
  if (refocusSelector){
    const el = $(refocusSelector);
    if (el){ el.focus(); const v = el.value; el.value = ''; el.value = v; }
    refocusSelector = null;
  }
}
document.addEventListener('change', e => {
  const t = e.target;

  if (t.matches('[data-action="bill-paid-toggle"]')){
    setBillPaid(t.dataset.id, t.checked);
    renderAll();
    return;
  }
  if (t.matches('[data-action="tx-select"]')){
    if (t.checked) UI.tx.sel.add(t.dataset.id); else UI.tx.sel.delete(t.dataset.id);
    renderView();
    return;
  }
  if (t.matches('[data-filter]')){
    UI.tx[t.dataset.filter] = t.value;
    UI.tx.page = 1;
    renderView();
    return;
  }
  if (t.matches('[data-sync-cat]')){
    const form = t.closest('form');
    const catSel = form.querySelector('[name="categoryId"]');
    const type = t.value;
    if (catSel){
      form.querySelectorAll('optgroup').forEach(g => {
        g.hidden = type === 'income' ? g.label !== 'Income' : g.label !== 'Expense';
      });
      let firstValid = null;
      const wanted = type === 'income' ? 'income' : 'expense';
      Array.from(catSel.options).forEach(o => {
        const kind = o.dataset.kind;
        if (!kind){ o.hidden = false; return; }
        const ok = kind === wanted;
        o.hidden = !ok;
        if (!ok && o.selected) o.selected = false;
        if (ok && o.value && !firstValid) firstValid = o;
      });
      if (firstValid && !catSel.value) catSel.value = firstValid.value;
      if (catSel.selectedOptions.length === 0 && firstValid) firstValid.selected = true;
    }
    const tr = form.querySelector('.transfer-only');
    if (tr) tr.style.display = type === 'transfer' ? 'block' : 'none';
    return;
  }
  if (t.id === 'import-file'){
    const f = t.files && t.files[0];
    if (f) importFile(f);
    t.value = '';
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'global-search'){
    UI.searchQ = t.value; UI.searchOpen = true;
    renderSearchPop();
    return;
  }
  if (t.dataset.filter === 'q'){
    UI.tx.q = t.value; UI.tx.page = 1;
    rerenderKeepFocus('[data-filter="q"]');
    return;
  }
  if (t.dataset.action === 'acct-search'){
    UI.acctQ = t.value;
    rerenderKeepFocus('[data-action="acct-search"]');
    return;
  }
  if (t.dataset.action === 'inc-search'){
    UI.incQ = t.value;
    rerenderKeepFocus('[data-action="inc-search"]');
    return;
  }
});

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){
    e.preventDefault();
    if ($('#modal-root').classList.contains('open')) closeModal();
    else openQuickAdd(UI.quickTab || 'transaction');
    return;
  }
  if (e.key === 'Escape'){
    if ($('#modal-root').classList.contains('open')) closeModal();
    else if (UI.searchOpen){ UI.searchOpen = false; renderSearchPop(); }
    else if (UI.notifOpen){ UI.notifOpen = false; renderTopbar(); }
    else if (UI.sidebarMobileOpen){ UI.sidebarMobileOpen = false; renderSidebar(); }
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'global-search'){
    e.preventDefault();
    const q = UI.searchQ.trim();
    if (q){
      UI.tx.q = q; UI.tx.range = 'all'; UI.tx.page = 1;
      UI.searchOpen = false;
      setView('transactions');
    }
  }
});

/* ---------- Resize (redraw charts) ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { try { renderView(); } catch(e){} }, 220);
});

/* ---------- Boot ---------- */
(function init(){
  DB.load();
  applyTheme(DB.data.settings.theme || 'light');
  try { UI.sidebarCollapsed = localStorage.getItem('PFM_PRO_SIDEBAR') === '1'; } catch(e){}
  const d = new Date();
  // Open on the budget period that actually contains today. The old branch here
  // assigned monthStart(d) in both arms, so with budgetStartDay > 1 the app
  // booted into a period that had not started yet (start day 15, today the 6th
  // → showed Oct 15-Nov 14 instead of the live Sep 15-Oct 14).
  UI.month = currentPeriodCursor(d);
  renderAll();
  setTimeout(() => {
    const n = attentionItems().length;
    if (n) setTimeout(() => toast(`${n} item${n===1?'':'s'} need attention — check the bell`, 'err'), 700);
  }, 500);
})();
</script>
